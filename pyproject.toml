[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agentic-research-platform"
version = "0.1.0"
description = "An enterprise-oriented multi-agent research platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic",
    "anthropic",
    "asyncpg",
    "fastapi",
    "httpx",
    "langgraph",
    "pydantic-settings",
    "pymilvus>=2.6.14,<3.0",
    "pypdf",
    "sqlalchemy[asyncio]",
    "tavily-python",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "reportlab",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that call external or containerized services.",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
