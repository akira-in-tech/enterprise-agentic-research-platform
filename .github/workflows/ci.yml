name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint backend
        run: python -m ruff check .

      - name: Type-check backend
        run: python -m mypy app tests alembic/env.py alembic/versions

      - name: Test backend
        run: python -m pytest -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  integration:
    name: Integration quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: research_platform
          POSTGRES_USER: research_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_user -d research_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://research_user:change_me@localhost:5432/research_platform
      REDIS_URL: redis://localhost:6379/0
      RUN_LIVE_TESTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run PostgreSQL- and Redis-backed integration tests
        run: |
          python -m pytest -q -m integration \
            tests/integration/test_agent_step_repository_live.py \
            tests/integration/test_knowledge_document_lifecycle_postgres_live.py \
            tests/integration/test_langgraph_postgres_resume_live.py \
            tests/integration/test_mcp_server_live.py \
            tests/integration/test_postgres_repositories_live.py \
            tests/integration/test_readiness_live.py \
            tests/integration/test_redis_idempotency_live.py \
            tests/integration/test_redis_live.py \
            tests/integration/test_redis_rate_limit_live.py \
            tests/integration/test_redis_research_result_cache_live.py \
            tests/integration/test_research_durability_postgres_live.py \
            tests/integration/test_research_execution_postgres_live.py \
            tests/integration/test_research_idempotency_concurrency_live.py \
            tests/integration/test_research_job_delivery_live.py \
            tests/integration/test_research_progress_redis_live.py \
            tests/integration/test_research_reports_postgres_live.py

  terraform:
    name: Terraform quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize and validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate

      - name: Initialize and validate staging
        working-directory: infra/terraform/staging
        run: terraform init -backend=false && terraform validate

      - name: Initialize and validate deployment identity
        working-directory: infra/terraform/identity
        run: terraform init -backend=false && terraform validate

      - name: Test staging plan invariants
        working-directory: infra/terraform/staging
        run: terraform test

      - name: Test deployment identity invariants
        working-directory: infra/terraform/identity
        run: terraform test

      - name: Validate deployment script syntax
        run: bash -n scripts/aws-deploy.sh scripts/aws-destroy.sh

  containers:
    name: Container packaging
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - integration
      - terraform
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f compose.yml config --quiet

      - name: Validate smoke script syntax
        run: sh -n scripts/compose-smoke.sh

      - name: Build API image
        run: docker build --tag evident-api:ci .

      - name: Build frontend image
        run: docker build --tag evident-frontend:ci frontend
